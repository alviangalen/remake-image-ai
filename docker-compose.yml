services:
  # 1. MESIN LLM (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: victus_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=0      
      - OLLAMA_NUM_PARALLEL=1
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
    volumes:
      - ./models/ollama:/root/.ollama
      - ./scripts/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -Fq \"${LLM_MODEL:-qwen2.5:7b}\""]
      interval: 3s
      timeout: 5s
      retries: 1200
      start_period: 5s

  # 2A. AUTO-DOWNLOAD & VERIFIKASI MODEL COMFYUI
  comfyui-init:
    image: yanwk/comfyui-boot:cu126-slim
    container_name: victus_comfy_init
    restart: "no"
    volumes:
      - ./models/comfyui:/models
      - ./custom_nodes:/custom_nodes
      - ./scripts/init-comfy-models.sh:/init-comfy-models.sh:ro
    entrypoint: ["/bin/bash", "/init-comfy-models.sh"]

  # 2B. MESIN EDIT GAMBAR (ComfyUI Headless)
  comfyui:
    image: yanwk/comfyui-boot:cu126-slim
    container_name: victus_comfy
    restart: unless-stopped
    environment:
      - CLI_ARGS=--lowvram --reserve-vram 0.5 --listen 0.0.0.0 --disable-auto-launch
    volumes:
      - ./models/comfyui:/root/ComfyUI/models
      - ./logs:/root/ComfyUI/user/logs
      - ./scripts/comfy-pre-start.sh:/root/user-scripts/pre-start.sh
      - ./custom_nodes/ComfyUI-GGUF:/root/ComfyUI/custom_nodes/ComfyUI-GGUF
    ports:
      - "${COMFY_PORT}:8188"
    depends_on:
      comfyui-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8188/system_stats"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. BACKEND ORCHESTRATOR & VRAM GUARD (FastAPI)
  backend:
    build: ./backend
    container_name: victus_backend
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://ollama:11434
      - COMFY_URL=http://comfyui:8188
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - ./backend/app:/app
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      ollama:
        condition: service_healthy
      comfyui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # 4. FRONTEND WEB UI (React + Nginx Alpine)
  frontend:
    build: ./frontend
    container_name: victus_webui
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
