services:
  # 1. MESIN LLM (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: victus_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=0      
      - OLLAMA_NUM_PARALLEL=1       
    volumes:
      - ./models/ollama:/root/.ollama
      - ./scripts/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MESIN EDIT GAMBAR (ComfyUI Headless)
  comfyui:
    image: yanwk/comfyui-boot:cu124-slim
    container_name: victus_comfy
    restart: unless-stopped
    environment:
      - CLI_ARGS=--lowvram --reserve-vram 0.5 --listen 0.0.0.0 --disable-auto-launch
    volumes:
      - ./models/comfyui:/root/ComfyUI/models
      - ./logs:/root/ComfyUI/user/logs
      - ./scripts/init-comfy.sh:/init-comfy.sh
    entrypoint: ["/bin/bash", "-c", "chmod +x /init-comfy.sh && /init-comfy.sh"]
    ports:
      - "${COMFY_PORT}:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. BACKEND ORCHESTRATOR & VRAM GUARD (FastAPI)
  backend:
    build: ./backend
    container_name: victus_backend
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://ollama:11434
      - COMFY_URL=http://comfyui:8188
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - ./backend/app:/app
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - ollama
      - comfyui

  # 4. FRONTEND WEB UI (React + Nginx Alpine)
  frontend:
    build: ./frontend
    container_name: victus_webui
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend