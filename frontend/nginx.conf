server {
    listen 80;
    client_max_body_size 50M; # Biar bisa upload foto resolusi tinggi

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 300s; # Tunggu sampai render gambar beres
    }
}